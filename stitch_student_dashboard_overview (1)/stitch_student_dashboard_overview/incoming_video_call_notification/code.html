<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GuruConnect - Incoming Call</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#13ec5b",
                "background-light": "#f6f8f6",
                "background-dark": "#102216",
                },
                fontFamily: {
                "display": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                animation: {
                    'pulse-ring': 'pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite',
                },
                keyframes: {
                    'pulse-ring': {
                        '0%': { transform: 'scale(0.95)', boxShadow: '0 0 0 0 rgba(19, 236, 91, 0.7)' },
                        '70%': { transform: 'scale(1)', boxShadow: '0 0 0 20px rgba(19, 236, 91, 0)' },
                        '100%': { transform: 'scale(0.95)', boxShadow: '0 0 0 0 rgba(19, 236, 91, 0)' },
                    }
                }
            },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-panel {
            background: rgba(16, 34, 22, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#111813] dark:text-white min-h-screen relative overflow-hidden font-display">
<!-- Background Context (Dashboard) -->
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden blur-[4px] opacity-60 pointer-events-none select-none">
<div class="layout-container flex h-full grow flex-col">
<div class="px-40 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f0f4f2] dark:border-b-[#1f2b23] px-10 py-3">
<div class="flex items-center gap-8">
<div class="flex items-center gap-4 text-[#111813] dark:text-white">
<div class="size-4">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path></svg>
</div>
<h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">GuruConnect</h2>
</div>
<label class="flex flex-col min-w-40 !h-10 max-w-64">
<div class="flex w-full flex-1 items-stretch rounded-xl h-full">
<div class="text-[#61896f] flex border-none bg-[#f0f4f2] dark:bg-[#1a2e22] items-center justify-center pl-4 rounded-l-xl border-r-0">
<span class="material-symbols-outlined text-[24px]">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111813] dark:text-white focus:outline-0 focus:ring-0 border-none bg-[#f0f4f2] dark:bg-[#1a2e22] focus:border-none h-full placeholder:text-[#61896f] px-4 rounded-l-none border-l-0 pl-2 text-base font-normal leading-normal" placeholder="Search" value=""/>
</div>
</label>
</div>
<div class="flex flex-1 justify-end gap-8">
<div class="flex items-center gap-9">
<a class="text-[#111813] dark:text-white text-sm font-medium leading-normal" href="#">Dashboard</a>
<a class="text-[#111813] dark:text-white text-sm font-medium leading-normal" href="#">Tutors</a>
<a class="text-[#111813] dark:text-white text-sm font-medium leading-normal" href="#">Sessions</a>
<a class="text-[#111813] dark:text-white text-sm font-medium leading-normal" href="#">Resources</a>
</div>
<div class="flex gap-2">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 bg-[#f0f4f2] dark:bg-[#1a2e22] text-[#111813] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</button>
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 bg-[#f0f4f2] dark:bg-[#1a2e22] text-[#111813] dark:text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5">
<span class="material-symbols-outlined text-[20px]">account_circle</span>
</button>
</div>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="User profile picture" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD5TD8pJuGgWWYF8S7mEfYOhXlXXY4-7cFlTbniE2dCpQhUj7Y9SYJV8P4a819R6YPavVq-la8sBHLmORt1mc454fZtl-l4kPzxFLb3sQdRFCikOFUw-lDOI0PQUwyWfF0pMBVI7dDnTN-ad2QZegDRkEQlBDpbfn3F0UhtL2S5W8wlI8XuBKwtp7F4Sq11FUADFe6Lu3swHXXPv5DTCEp1lLhsk4O_tJWfxeNGmVUepyFqv4t3rwFsndIbs4o1qk8kytOABeakL5ku");'></div>
</div>
</header>
<div class="flex flex-col gap-6 p-10">
<div class="h-64 w-full rounded-xl bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-emerald-900/20 dark:to-teal-900/20"></div>
<div class="grid grid-cols-3 gap-6">
<div class="h-40 rounded-xl bg-white dark:bg-[#1a2e22]"></div>
<div class="h-40 rounded-xl bg-white dark:bg-[#1a2e22]"></div>
<div class="h-40 rounded-xl bg-white dark:bg-[#1a2e22]"></div>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
<!-- Notification Card -->
<div class="glass-panel w-full max-w-md rounded-[2rem] p-8 shadow-2xl animate-fade-in relative overflow-hidden">
<!-- Decorative background blobbies -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-blue-400/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center text-center">
<!-- Incoming Label -->
<div class="mb-8 flex flex-col gap-1">
<h3 class="text-sm font-semibold tracking-wide uppercase text-[#61896f] dark:text-emerald-400">Incoming Video Call...</h3>
<p class="text-xs text-[#61896f]/70 dark:text-emerald-400/70">GuruConnect Live Session</p>
</div>
<!-- Avatar with Pulse -->
<div class="relative mb-8">
<div class="absolute inset-0 rounded-full bg-primary/30 animate-pulse-ring"></div>
<div class="relative h-32 w-32 rounded-full p-1 bg-white dark:bg-[#102216]">
<div class="h-full w-full rounded-full bg-cover bg-center bg-no-repeat shadow-inner" data-alt="Profile picture of Professor Rajesh Kumar" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBdoNO3rtF0q8mON24I3NjyDRI9SodIdpje3iy6rPqgbh4_I7QlbDWOkd6IHzO2dZ6l7l8321KZJfVqyUtJYCBcRkNVkWw1RV9S_wZe4lM_c8Ym0FqautfzobYUBYi_dOxmHu0ZpzpnFGhy6T0A2Anv6TdracjToAf2E0Bm0yQgfqVDLLKzattv8HLLurtKpTLfwoZ8yUpaeWXmo9OtEvIxX5zsLF-5WwiPXRan6vyVw4E_7YJUsvGDT8ULIO1I4gc85HzZxeVCDDh8');">
</div>
</div>
<!-- Status Icon Badge -->
<div class="absolute bottom-1 right-1 flex h-8 w-8 items-center justify-center rounded-full bg-primary text-white shadow-lg border-2 border-white dark:border-[#102216]">
<span class="material-symbols-outlined text-[16px]">videocam</span>
</div>
</div>
<!-- Caller Info -->
<div class="mb-10 space-y-1">
<h2 class="text-2xl font-bold text-[#111813] dark:text-white">Prof. Rajesh Kumar</h2>
<p class="text-base font-medium text-[#61896f] dark:text-gray-300">Advanced Physics Session</p>
</div>
<!-- Action Buttons -->
<div class="flex w-full items-center justify-center gap-6 mb-6">
<!-- Decline Button -->
<button aria-label="Decline Call" class="group flex h-14 w-14 items-center justify-center rounded-full bg-red-100 text-red-600 transition-all hover:bg-red-600 hover:text-white hover:scale-110 focus:outline-none focus:ring-4 focus:ring-red-200 dark:bg-red-900/30 dark:text-red-400 dark:hover:bg-red-600 dark:hover:text-white">
<span class="material-symbols-outlined text-[28px] group-hover:animate-bounce">call_end</span>
</button>
<!-- Accept Button -->
<button aria-label="Accept Call" class="group flex h-20 w-20 items-center justify-center rounded-full bg-primary text-[#102216] shadow-lg shadow-primary/30 transition-all hover:bg-[#0fd650] hover:scale-110 hover:shadow-primary/50 focus:outline-none focus:ring-4 focus:ring-primary/40">
<span class="material-symbols-outlined text-[36px] group-hover:animate-pulse">videocam</span>
</button>
<!-- Message Button (Optional extra action for balance) -->
<button aria-label="Send Message" class="group flex h-14 w-14 items-center justify-center rounded-full bg-[#f0f4f2] text-[#111813] transition-all hover:bg-gray-200 hover:scale-110 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:bg-[#1a2e22] dark:text-white dark:hover:bg-[#253f30]">
<span class="material-symbols-outlined text-[24px]">chat</span>
</button>
</div>
<!-- Audio Only Option -->
<button class="flex items-center gap-2 rounded-full px-4 py-2 text-sm font-semibold text-[#61896f] transition-colors hover:bg-primary/10 hover:text-primary dark:text-emerald-400 dark:hover:bg-primary/20">
<span class="material-symbols-outlined text-[18px]">mic</span>
                    Answer with Audio Only
                </button>
</div>
</div>
</div>
</body></html>
